# Select this Blueprint explicitly only after release approval. Creation starts an initial deployment.
# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: together-finance-api
    runtime: node
    plan: free
    branch: main
    rootDir: backend
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run check:production && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: TRUST_PROXY_HOPS
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SHARED_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PRODUCTION_FRONTEND_ORIGIN
        sync: false
      - key: PRODUCTION_EXPECTED_DATABASE_HOST
        sync: false
      - key: PRODUCTION_EXPECTED_DATABASE_NAME
        sync: false
      - key: PRODUCTION_DATABASE_CONFIRMED
        sync: false
